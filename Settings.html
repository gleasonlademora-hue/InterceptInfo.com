<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InterceptInfo - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container-fluid min-vh-100 d-flex flex-column p-0">
        <header>
            <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
                <div class="container-fluid">
                    <img src="Images/Logo/be207ecd2a24e89612dbcf218e402bb2.jpg" alt="InterceptInfo Logo"
                        style="width: 40px" class="rounded-pill" />
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapsibleNavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="collapsibleNavbar">

                        <ul class="navbar-nav mx-auto">
                            <li class="nav-item border rounded m-1">
                                <a class="nav-link" href="InterceptInfo.html">Home</a>
                            </li>
                            <li class="nav-item border rounded m-1">
                                <a class="nav-link" href="InterceptInfo.html#active">Active Vehicles</a>
                            </li>
                            <li class="nav-item border rounded m-1">
                                <a class="nav-link" href="InterceptInfo.html#inactive">Inactive Vehicles</a>
                            </li>
                            <li class="nav-item border rounded m-1">
                                <a class="nav-link" href="InterceptInfo.html#history">History</a>
                            </li>
                        </ul>

                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item dropdown m-1">
                                <a class="nav-link dropdown-toggle px-3 active" href="#" role="button"
                                    data-bs-toggle="dropdown">
                                    &#9776;
                                </a>
                                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                                    <li><a class="dropdown-item active" href="settings.html">Settings</a></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container my-5 flex-grow-1">
            <h2 class="text-center mb-4">Website Settings</h2>

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm border">
                        <div class="card-header bg-dark text-white fw-bold">
                            Appearance & Theme
                        </div>
                        <div class="card-body p-4">
                            <div class="mb-3">
                                <label for="themeSelect" class="form-label fw-semibold">Website Theme</label>
                                <select class="form-select" id="themeSelect">
                                    <option value="light">Light Mode</option>
                                    <option value="dark">Dark Mode</option>
                                    <option value="system" selected>System Theme</option>
                                </select>
                                <div class="form-text">
                                    Choose your preferred color theme or let it match your operating system settings.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="bg-dark text-white text-center py-3 mt-auto">
            <p class="mb-0">© 2026 InterceptInfo - Storm Chasing Database</p>
        </footer>
    </div>

    <script>
        const themeSelect = document.getElementById('themeSelect');

        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            if (theme === 'system') {
                document.documentElement.setAttribute('data-bs-theme', getSystemTheme());
            } else {
                document.documentElement.setAttribute('data-bs-theme', theme);
            }
        }

        const savedTheme = localStorage.getItem('user-theme') || 'system';
        themeSelect.value = savedTheme;
        applyTheme(savedTheme);

        themeSelect.addEventListener('change', (e) => {
            const selectedTheme = e.target.value;
            localStorage.setItem('user-theme', selectedTheme);
            applyTheme(selectedTheme);
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (localStorage.getItem('user-theme') === 'system' || !localStorage.getItem('user-theme')) {
                applyTheme('system');
            }
        });
    </script>
</body>

</html>
